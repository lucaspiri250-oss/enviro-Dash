name: test

on:
  push:
  pull_request:

jobs:
  test-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:sources

  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test-sources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run sources
      - run: npm run build
      - run: npm run test:e2e

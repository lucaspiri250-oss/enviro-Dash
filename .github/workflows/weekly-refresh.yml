name: weekly-refresh

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch:      # allow manual trigger from the Actions tab

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Netlify rebuild
        run: |
          curl -f -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}" \
            --silent --show-error

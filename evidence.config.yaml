appearance:
  default: system
  switcher: true

theme:
  colorPalettes:
    default:
      # Environmental palette: forest greens, ocean blues, earth tones.
      # Ordered to be distinguishable under deuteranopia (red/green colour blindness)
      # by alternating between blue-family and green/amber families.
      light:
        - "#1a7a4a"   # deep forest green
        - "#1565c0"   # ocean blue
        - "#d97706"   # amber / earth
        - "#0e7490"   # deep teal
        - "#7c3aed"   # iris (distinguishable from green/blue)
        - "#65a30d"   # grass green
        - "#c2410c"   # terracotta
        - "#0369a1"   # sky blue
        - "#4d7c0f"   # olive
        - "#92400e"   # earth brown
      dark:
        - "#34d399"   # mint green
        - "#60a5fa"   # bright blue
        - "#fbbf24"   # golden amber
        - "#22d3ee"   # bright teal
        - "#a78bfa"   # lavender
        - "#a3e635"   # bright lime
        - "#fb923c"   # orange
        - "#38bdf8"   # sky blue
        - "#86efac"   # light green
        - "#fde68a"   # warm yellow

  colorScales:
    default:
      light:
        - "#d1fae5"   # lightest green
        - "#065f46"   # darkest forest green
      dark:
        - "#064e3b"
        - "#6ee7b7"

  colors:
    primary:
      light: "#1a7a4a"   # forest green
      dark:  "#34d399"   # mint green
    accent:
      light: "#d97706"   # amber
      dark:  "#fbbf24"   # golden
    base:
      light: "#f9fafb"   # off-white (easier on the eye than pure white)
      dark:  "#09090b"
    info:
      light: "#0369a1"
      dark:  "#38bdf8"
    positive:
      light: "#16a34a"
      dark:  "#4ade80"
    warning:
      light: "#d97706"
      dark:  "#fbbf24"
    negative:
      light: "#dc2626"
      dark:  "#f87171"

plugins:
  components:
    "@evidence-dev/core-components": {}

  datasources:
    "@evidence-dev/bigquery": { }
    "@evidence-dev/csv": { }
    "@evidence-dev/databricks": { }
    "@evidence-dev/duckdb": { }
    "@evidence-dev/mssql": { }
    "@evidence-dev/mysql": { }
    "@evidence-dev/postgres": { }
    "@evidence-dev/source-javascript": { }
    "@evidence-dev/snowflake": { }
    "@evidence-dev/sqlite": { }
    "@evidence-dev/trino": { }
    "@evidence-dev/motherduck": { }
